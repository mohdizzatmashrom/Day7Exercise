spring.application.name=AssetTracker

server.port=${SERVER_PORT:8080}

# spring.data.mongodb.uri=mongodb://app_user:pwd12345@localhost:27017/?authSource=asset_tracker_db
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=asset_tracker_db
spring.data.mongodb.authentication-database=asset_tracker_db
spring.data.mongodb.username=app_user
spring.data.mongodb.password=root123

spring.data.mongodb.auto-index-creation=true

spring.jackson.serialization.indent-output=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always

logging.level.root=INFO
logging.level.com.example.assettracker=DEBUG